name: Regenerate card stats

# Every path that updates the data files (sync.yml, the external openclaw-bot sync, a manual
# edit) ends in a push to master. This catches all of them: after any push touching the data,
# regenerate the published counts (index.html cards + assets/hero.svg) from the data and commit
# them if they moved. Pushes made with GITHUB_TOKEN do not retrigger workflows, so no loop.
on:
  push:
    branches: [master]
    paths:
      - openclaw_data.js
      - hermes_data.js
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch claims/validate/deploy after committing the counts

concurrency:
  group: card-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: node scripts/update-stats.mjs
      - name: Commit if the counts moved
        id: commit
        run: |
          if git diff --quiet -- index.html assets/hero.svg; then
            echo "Counts already match the data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/hero.svg
          git commit -m "chore: regenerate card stats from data files"
          git pull --rebase origin master
          git push origin HEAD:master
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # A push made with GITHUB_TOKEN does not start `push` workflows (no loop, but also no checks
      # and no Pages deploy for the corrected commit). workflow_dispatch is the documented exception,
      # so re-run the checks and the deploy on the new master HEAD explicitly. Seen 2026-10-16:
      # claims stayed red on 915d836 and the site kept showing 186 after b1a8638 fixed the cards.
      - name: Re-run checks and deploy on the corrected commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run claims.yml --ref master
          gh workflow run validate.yml --ref master
          gh workflow run deploy.yml --ref master
