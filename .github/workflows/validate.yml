name: Validate

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - '.github/workflows/**'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint & format check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Validate JS syntax in HTML
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const html = fs.readFileSync('index.html', 'utf-8');
          const re = /<script>([\\s\\S]*?)<\\/script>/g;
          let m, i = 0;
          while ((m = re.exec(html)) !== null) {
            i++;
            const body = m[1].trim();
            if (!body) continue;
            fs.writeFileSync('/tmp/_v.js', body);
            execSync('node --check /tmp/_v.js');
          }
          console.log('Validated ' + i + ' script block(s) — OK');
          "
