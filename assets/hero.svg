<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Changelog — release tracker for AI agent frameworks</title>
  <desc id="desc">Two tracked projects (OpenClaw, Hermes Agent) whose GitHub Releases are parsed for the Highlights section by a daily cron job and rendered as browsable bilingual HTML pages.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12171e"/>
      <stop offset="1" stop-color="#0d1116"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="20" fill="#080a0d"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" fill="none" stroke="#1d242d"/>

  <g id="title-block" transform="translate(56 52)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6f7d8c" letter-spacing="2.4">AI AGENT FRAMEWORKS · RELEASE TRACKER</text>
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="54" font-weight="700" fill="#e8eef6">Agent Changelog</text>
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" fill="#9dabba">Upstream releases become a browsable, bilingual changelog.</text>

    <g transform="translate(0 150)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <rect x="0" y="-22" width="196" height="38" rx="10" fill="#111823" stroke="#233040"/>
      <text x="14" y="2" fill="#c8d4e2">GitHub Releases API</text>
      <path d="M202 0 h22 m-6 -6 l6 6 -6 6" stroke="#3d4c5e" stroke-width="2" fill="none"/>

      <rect x="230" y="-22" width="176" height="38" rx="10" fill="#111823" stroke="#233040"/>
      <text x="244" y="2" fill="#c8d4e2">parse Highlights</text>
      <path d="M412 0 h22 m-6 -6 l6 6 -6 6" stroke="#3d4c5e" stroke-width="2" fill="none"/>

      <rect x="440" y="-22" width="150" height="38" rx="10" fill="#111823" stroke="#233040"/>
      <text x="454" y="2" fill="#c8d4e2">generate HTML</text>
      <path d="M596 0 h22 m-6 -6 l6 6 -6 6" stroke="#3d4c5e" stroke-width="2" fill="none"/>

      <rect x="624" y="-22" width="152" height="38" rx="10" fill="#0e1c22" stroke="#00ccff" stroke-opacity="0.45"/>
      <text x="638" y="2" fill="#7fdfff">GitHub Pages</text>
    </g>

    <g transform="translate(0 232)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7b8899">
      <text x="0" y="0">2 projects tracked</text>
      <circle cx="176" cy="-6" r="3" fill="#2b3644"/>
      <text x="194" y="0">daily cron sync</text>
      <circle cx="356" cy="-6" r="3" fill="#2b3644"/>
      <text x="374" y="0">no manual updates</text>
    </g>
  </g>

  <g id="release-panel" transform="translate(700 46)">
    <rect x="0" y="0" width="444" height="268" rx="16" fill="url(#panel)" stroke="#1e2833"/>

    <g transform="translate(24 38)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6f7d8c" letter-spacing="1.6">2026 年 7 月 · OPENCLAW</text>
      <line x1="0" y1="16" x2="396" y2="16" stroke="#1e2833"/>

      <g transform="translate(0 48)">
        <circle cx="4" cy="-6" r="4" fill="#00ccff"/>
        <text x="20" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#dbe6f2">v2026.7.1</text>
        <text x="128" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6f7d8c">2026-07-13</text>
        <rect x="268" y="-18" width="52" height="24" rx="7" fill="#12261a" stroke="#1f4a2c"/>
        <text x="280" y="-1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#7fd6a0">新增</text>
        <rect x="330" y="-18" width="52" height="24" rx="7" fill="#2a1c12" stroke="#4a3520"/>
        <text x="342" y="-1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#e0b47f">修复</text>
      </g>

      <g transform="translate(0 100)">
        <circle cx="4" cy="-6" r="4" fill="#3d4c5e"/>
        <text x="20" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#dbe6f2">v2026.7.2</text>
        <text x="128" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6f7d8c">2026-07-21</text>
        <rect x="268" y="-18" width="52" height="24" rx="7" fill="#121c2a" stroke="#1f3549"/>
        <text x="280" y="-1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#8fb8e0">优化</text>
      </g>

      <g transform="translate(0 152)">
        <circle cx="4" cy="-6" r="4" fill="#3d4c5e"/>
        <text x="20" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#dbe6f2">v2026.6.35</text>
        <text x="128" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6f7d8c">2026-06-30</text>
        <rect x="268" y="-18" width="52" height="24" rx="7" fill="#2a1214" stroke="#4a2024"/>
        <text x="280" y="-1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#e0919a">安全</text>
      </g>
    </g>

    <g transform="translate(24 240)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6f7d8c">
      <text x="0" y="0">OpenClaw 32+ versions · Hermes Agent 12</text>
    </g>
  </g>
</svg>
