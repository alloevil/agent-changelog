<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="title desc">
  <title id="title">Agent Changelog</title>
  <desc id="desc">A dark-themed hero showing version timeline tracking for AI agent frameworks OpenClaw and Hermes Agent.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="0" fill="#0d1117"/>

  <!-- Subtle grid -->
  <g opacity="0.03">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#c9d1d9" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#c9d1d9" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#c9d1d9" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#c9d1d9" stroke-width="1"/>
  </g>

  <!-- Left: Title block -->
  <g id="title-block" transform="translate(64 44)">
    <text x="0" y="0" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="500" letter-spacing="2">
      OPEN SOURCE · VERSION TRACKER
    </text>

    <text x="0" y="48" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="700">
      Agent Changelog
    </text>

    <text x="0" y="82" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16">
      Track version updates and evolution of AI agent frameworks
    </text>

    <!-- Project pills -->
    <g transform="translate(0 110)">
      <rect x="0" y="0" width="120" height="28" rx="14" fill="#58A6FF" fill-opacity="0.1" stroke="#58A6FF" stroke-opacity="0.3" stroke-width="1"/>
      <text x="60" y="18" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" font-weight="600">OpenClaw 32+</text>

      <rect x="128" y="0" width="140" height="28" rx="14" fill="#3FB950" fill-opacity="0.1" stroke="#3FB950" stroke-opacity="0.3" stroke-width="1"/>
      <text x="198" y="18" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" font-weight="600">Hermes Agent 12</text>

      <rect x="276" y="0" width="120" height="28" rx="14" fill="#8b949e" fill-opacity="0.05" stroke="#30363d" stroke-width="1"/>
      <text x="336" y="18" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">2026.1 — now</text>
    </g>

    <!-- Tags -->
    <g transform="translate(0 156)">
      <text x="0" y="0" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">
        GitHub Releases · Auto-sync · Highlights parsing · HTML generation
      </text>
    </g>
  </g>

  <!-- Right: Version timeline visualization -->
  <g id="timeline" transform="translate(640 40)">
    <!-- Timeline track -->
    <line x1="20" y1="0" x2="20" y2="220" stroke="#30363d" stroke-width="2"/>

    <!-- Version dots — OpenClaw -->
    <g>
      <circle cx="20" cy="20" r="6" fill="#58A6FF"/>
      <text x="36" y="24" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">v2026.7.1</text>
      <text x="140" y="24" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Latest</text>

      <circle cx="20" cy="55" r="5" fill="#58A6FF" opacity="0.7"/>
      <text x="36" y="59" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">v2026.6.0</text>

      <circle cx="20" cy="90" r="5" fill="#58A6FF" opacity="0.5"/>
      <text x="36" y="94" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">v2026.5.0</text>

      <circle cx="20" cy="125" r="5" fill="#58A6FF" opacity="0.3"/>
      <text x="36" y="129" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">v2026.4.0</text>
    </g>

    <!-- Version dots — Hermes -->
    <g transform="translate(200 0)">
      <circle cx="20" cy="20" r="6" fill="#3FB950"/>
      <text x="36" y="24" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">v0.12.0</text>
      <text x="120" y="24" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Latest</text>

      <circle cx="20" cy="55" r="5" fill="#3FB950" opacity="0.7"/>
      <text x="36" y="59" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">v0.11.0</text>

      <circle cx="20" cy="90" r="5" fill="#3FB950" opacity="0.5"/>
      <text x="36" y="94" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">v0.10.0</text>
    </g>

    <!-- Label -->
    <text x="20" y="196" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Auto-synced from GitHub Releases</text>

    <!-- Sync indicator -->
    <g transform="translate(20 208)">
      <circle cx="6" cy="6" r="4" fill="#3FB950" opacity="0.8"/>
      <text x="16" y="10" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Live · Daily cron</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="64" y="280" width="180" height="3" rx="1.5" fill="url(#accent)" opacity="0.5"/>
</svg>
